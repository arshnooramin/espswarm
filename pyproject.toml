[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-esp"
version = "0.1.0.dev0"
description = "Python library for controlling ESP32 boards over MQTT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["paho-mqtt>=2.1,<3"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/arshnooramin/virtual-esp"

[project.optional-dependencies]
dev = ["black>=25.9,<27", "build>=1.2,<2", "ruff>=0.14,<1", "pytest>=8.4,<10"]
board = ["esptool>=5,<6", "mpremote>=1.29,<2"]

[tool.black]
# Preserve syntax supported by MicroPython (e.g. parenthesized except tuples).
target-version = ["py310"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["firmware", "tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtual_esp = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Board code runs on MicroPython, which has a smaller standard library.
[tool.ruff.lint.per-file-ignores]
"firmware/**/*.py" = ["UP"]
